<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#081024" />
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0" stop-color="#0ea5a4" />
      <stop offset="1" stop-color="#0891b2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#g1)" />

  <!-- isometric grid of cubes -->
  <g transform="translate(220,60) scale(1.1)">
    <!-- cube 1 -->
    <g filter="url(#shadow)">
      <polygon points="120,0 200,40 200,120 120,80" fill="#0ea5a4" opacity="0.95" />
      <polygon points="120,0 40,40 120,80 200,40" fill="#06b6d4" opacity="0.95" />
      <polygon points="40,40 120,80 120,160 40,120" fill="#036069" opacity="0.95" />
    </g>

    <!-- cube 2 -->
    <g transform="translate(160,-40)" filter="url(#shadow)">
      <polygon points="120,0 200,40 200,120 120,80" fill="#0891b2" />
      <polygon points="120,0 40,40 120,80 200,40" fill="#06b6d4" />
      <polygon points="40,40 120,80 120,160 40,120" fill="#034a51" />
    </g>

    <!-- floating platform -->
    <g transform="translate(-20,160)">
      <rect x="0" y="0" width="520" height="18" rx="8" fill="#071423" opacity="0.6" />
      <rect x="8" y="-26" width="504" height="26" rx="6" fill="url(#g2)" />
      <text x="40" y="-8" fill="#021724" font-family="Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700">3D Isometric Tech Banner</text>
    </g>

    <!-- subtle grid lines -->
    <g opacity="0.06" stroke="#ffffff" stroke-width="1">
      <line x1="-40" y1="200" x2="520" y2="200" />
      <line x1="-40" y1="260" x2="520" y2="260" />
    </g>
  </g>

  <!-- right-side abstract shapes -->
  <g transform="translate(980,40)">
    <circle cx="120" cy="80" r="60" fill="#06202a" />
    <circle cx="120" cy="80" r="44" fill="url(#g2)" opacity="0.9" />
    <rect x="40" y="160" width="220" height="90" rx="14" fill="#04202a" opacity="0.5" />
  </g>

  <!-- subtle vignette -->
  <rect width="100%" height="100%" fill="url(#g1)" opacity="0.06" />
</svg>
